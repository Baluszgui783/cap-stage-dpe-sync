name: Actualisation hebdomadaire
on:
  schedule:
    - cron: '23 7 * * 1'
      timezone: Europe/Paris
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: directory-weekly
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Actualiser uniquement les contacts
        id: sync
        env:
          SYNC_CONFIG: ${{ secrets.SYNC_CONFIG }}
          SYNC_PASSWORD: ${{ secrets.SYNC_PASSWORD }}
        run: npm run sync
      - name: Conserver uniquement un état technique du planificateur
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_RESULT: ${{ steps.sync.outcome }}
        run: node scripts/heartbeat.mjs
